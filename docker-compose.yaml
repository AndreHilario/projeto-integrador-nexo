services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Backend/dbfiles:/docker-entrypoint-initdb.d

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - db

  auth-service:
    build:
      context: ./Backend/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nexo
      DB_USER: nexo
      DB_PASSWORD: nexo
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-please-0123456789}
      JWT_EXPIRATION_MINUTES: 120
    depends_on:
      - db

  jobs-service:
    build:
      context: ./Backend/jobs-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nexo
      DB_USER: nexo
      DB_PASSWORD: nexo
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-please-0123456789}
    depends_on:
      - db

  applications-service:
    build:
      context: ./Backend/applications-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nexo
      DB_USER: nexo
      DB_PASSWORD: nexo
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-please-0123456789}
    depends_on:
      - db

  krakend:
    image: devopsfaith/krakend:2.6
    restart: unless-stopped
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8000:8080"
    volumes:
      - ./Backend/krakend/krakend.json:/etc/krakend/krakend.json:ro
    depends_on:
      - auth-service
      - jobs-service
      - applications-service

volumes:
  db_data:
