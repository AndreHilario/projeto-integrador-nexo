services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Backend/dbfiles:/docker-entrypoint-initdb.d

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - db

  krakend:
    image: devopsfaith/krakend:2.6
    restart: unless-stopped
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8000:8080"
    volumes:
      - ./Backend/krakend/krakend.json:/etc/krakend/krakend.json:ro

volumes:
  db_data:
