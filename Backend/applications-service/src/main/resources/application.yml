server:
  port: 3003

spring:
  application:
    name: applications-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexo}
    username: ${DB_USER:nexo}
    password: ${DB_PASSWORD:nexo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

nexo:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.nexo.applications: DEBUG
    org.springframework.security: DEBUG
